    <script>
      (function () {
        try {
          var saved = localStorage.getItem('clip-cutter-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Clip Cutter",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "description": "Cut long videos into vertical shorts on your device with virality scores, hook detection, silence trimming, and burned-in captions.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What file sizes and video formats are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can upload MP4 or MOV files up to 1 GB (1024 MB). Large files stream to our proxy in 8 MB slices and mount locally via WORKERFS. Best performance is on source videos up to 30 minutes."
                }
              },
              {
                "@type": "Question",
                "name": "Where are my videos processed and stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Videos are cut, reframed, silence-trimmed, and captioned directly on your device using WebAssembly FFmpeg. Audio is sent securely through our server proxy for transcription and highlight analysis only when you start AI analysis."
                }
              },
              {
                "@type": "Question",
                "name": "How do YouTube links and copyright work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Public YouTube links are analyzed for timestamps and transcripts without ripping streams in your browser. Upload your own authorized source file to cut downloadable MP4 clips."
                }
              },
              {
                "@type": "Question",
                "name": "How do daily AI credits work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Each visitor receives 40 daily AI credits on our server. Manual cutting, waveform trimming, and local FFmpeg exports never consume AI credits."
                }
              }
            ]
          }
        ]
      }
