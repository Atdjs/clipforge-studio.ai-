<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clip Cutter — Quietly Precise Video Clipping</title>
    <meta
      name="description"
      content="Cut long videos into vertical shorts on your device. Virality scores, hook detection, silence trimming, and burned-in captions."
    />
    <meta property="og:title" content="Clip Cutter — Quietly Precise Video Clipping" />
    <meta
      property="og:description"
      content="Cut long videos into vertical shorts on your device. Virality scores, hook detection, silence trimming, and burned-in captions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clip Cutter — Quietly Precise Video Clipping" />

      name="twitter:description"
      content="Cut long videos into vertical shorts on your device. Virality scores, hook detection, silence trimming, and burned-in captions."
    />
    <meta name="twitter:image" content="/og-share.jpg" />
    <meta name="theme-color" content="#0E0E0F" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('clip-cutter-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Clip Cutter",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "description": "Cut long videos into vertical shorts on your device with virality scores, hook detection, silence trimming, and burned-in captions.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What file sizes and video formats are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can select local MP4 or MOV files up to 1 GB (1024 MB) via WORKERFS or paste a direct CORS-enabled MP4/MOV link without uploading the full video."
                }
              },
              {
                "@type": "Question",
                "name": "Where are my videos processed and stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Videos are cut, reframed, silence-trimmed, and captioned directly on your device using WebAssembly FFmpeg. Only compact 16 kHz mono audio (capped at 45 minutes) is sent to Gemini for cloud transcription, or you can toggle optional on-device Whisper transcription."
                }
              },
              {
                "@type": "Question",
                "name": "How does transcript caching save tokens?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Each video is transcribed once and cached in IndexedDB keyed by file hash. Highlight selection, batched virality scoring, titles, and translations run on text only."
                }
              },
              {
                "@type": "Question",
                "name": "Can I sync my editing session across computers?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Sign in with Google to save and open lightweight .clipcutter.json project files via Google Drive File Picker."
                }
              }
            ]
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</html>
